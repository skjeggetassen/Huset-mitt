<title>Huset mitt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell with side rail on wide screens and a bottom tab bar on phones; content in one scrolling column, the house view as a full-bleed workspace. */
:root {
  --bg: #F3F4F1;
  --surface: #FFFFFF;
  --surface-2: #EBEEEA;
  --ink: #18231F;
  --muted: #5B6862;
  --line: #D6DCD6;
  --accent: #2C6A57;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEBE5;
  --plan-bg: #FBFBF8;
  --plan-grid: #E6E9E3;
  --plan-grid-major: #CED5CD;
  --wall: #22302A;
  --room-fill: #EEF3EE;
  --ok: #2E7A4C;
  --ok-soft: #DDEFE3;
  --src: #2F64A0;
  --src-soft: #DEE8F5;
  --est: #A86A12;
  --est-soft: #F7E9CF;
  --bad: #B23B3B;
  --bad-soft: #F6DCDC;
  --shadow: 0 1px 2px rgba(24,35,31,.06), 0 6px 20px rgba(24,35,31,.07);
  --f-display: "Familjen Grotesk", "Hanken Grotesk", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  --r-sm: 6px;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #1A211E; --surface-2: #222B27; --ink: #E5ECE8; --muted: #9AA9A2; --line: #2F3A35;
    --accent: #6DB49B; --accent-ink: #0F1A16; --accent-soft: #1F3A31;
    --plan-bg: #141A17; --plan-grid: #1E2622; --plan-grid-major: #2A3530; --wall: #DCE5E0; --room-fill: #1C2622;
    --ok: #6CC08B; --ok-soft: #1D3526; --src: #7FA9DD; --src-soft: #1C2A3D; --est: #E0A84F; --est-soft: #3A2D16; --bad: #E77C7C; --bad-soft: #3D1F1F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1A211E; --surface-2: #222B27; --ink: #E5ECE8; --muted: #9AA9A2; --line: #2F3A35;
  --accent: #6DB49B; --accent-ink: #0F1A16; --accent-soft: #1F3A31;
  --plan-bg: #141A17; --plan-grid: #1E2622; --plan-grid-major: #2A3530; --wall: #DCE5E0; --room-fill: #1C2622;
  --ok: #6CC08B; --ok-soft: #1D3526; --src: #7FA9DD; --src-soft: #1C2A3D; --est: #E0A84F; --est-soft: #3A2D16; --bad: #E77C7C; --bad-soft: #3D1F1F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
* { box-sizing: border-box; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.65rem; font-weight: 700; }
h2 { font-size: 1.25rem; font-weight: 650; }
h3 { font-size: 1.05rem; font-weight: 650; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-family: var(--f-body); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.tiny { font-size: .76rem; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }

/* Shell */
.app { display: grid; grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; height: 100%; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-badge { background: var(--est-soft); color: var(--est); border: 1px solid currentColor; border-radius: 99px; padding: 2px 10px; font-size: .75rem; font-weight: 700; white-space: nowrap; }
main { overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
.page { max-width: 1120px; margin: 0 auto; padding-block: 18px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head > div { min-width: 0; }

.nav { display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; border: 0; background: none; color: var(--muted); font-size: .7rem; font-weight: 600; cursor: pointer; min-width: 0; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--accent); }
.nav .nav-extra { display: none; }

@media (min-width: 900px) {
  .app { grid-template-columns: 216px 1fr; grid-template-rows: auto 1fr; }
  .topbar { grid-column: 1 / -1; }
  .nav { grid-row: 2; grid-column: 1; flex-direction: column; border-top: 0; border-right: 1px solid var(--line); padding: 12px 10px; gap: 2px; overflow-y: auto; }
  .nav button { flex: none; flex-direction: row; gap: 10px; font-size: .9rem; padding: 9px 10px; border-radius: 8px; justify-content: flex-start; }
  .nav button[aria-current="page"] { background: var(--accent-soft); }
  .nav .nav-extra { display: flex; }
  .nav .nav-more { display: none; }
  .nav .nav-sep { display: block; height: 1px; background: var(--line); margin: 8px 6px; }
  main { grid-row: 2; grid-column: 2; }
}
.nav-sep { display: none; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: .9rem; cursor: pointer; white-space: nowrap; text-decoration: none; min-height: 38px; }
.btn:hover { border-color: var(--muted); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); border-color: var(--bad-soft); }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: .82rem; }
.btn.icon { padding: 6px; min-width: 38px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: .85rem; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button svg { width: 18px; height: 18px; flex: none; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea, .input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 8px 10px; min-height: 38px; }
.field textarea { min-height: 70px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.field.uncertain input, .field.uncertain select { border-color: var(--est); background: var(--est-soft); }
.field .hint { font-size: .75rem; color: var(--muted); }
.field.uncertain .hint { color: var(--est); font-weight: 600; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 12px; }
.form-grid .wide { grid-column: 1 / -1; }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.grid-2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
@media (max-width: 420px) { .grid-2, .grid { grid-template-columns: 1fr; } }
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 600; overflow-wrap: anywhere; }
.row.click { cursor: pointer; }
.row.click:hover .title { color: var(--accent); }
.empty { color: var(--muted); padding: 14px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); font-size: .9rem; }
.empty strong { color: var(--ink); display: block; margin-bottom: 4px; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.src { background: var(--src-soft); color: var(--src); }
.pill.est { background: var(--est-soft); color: var(--est); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.stat .v { font-family: var(--f-display); font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .k { font-size: .75rem; color: var(--muted); font-weight: 600; }
.stat.warn .v { color: var(--bad); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar > i.paid { background: var(--accent); }
.bar > i.rem { background: var(--est); opacity: .75; }
.bar > i.over { background: var(--bad); }

.notice { border-radius: 8px; padding: 10px 12px; font-size: .88rem; display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); }
.notice svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.notice.warn { background: var(--est-soft); color: var(--ink); }
.notice.warn svg { color: var(--est); }
.notice.bad { background: var(--bad-soft); }
.notice.bad svg { color: var(--bad); }
.notice.info svg { color: var(--src); }
.notice.ok { background: var(--ok-soft); }
.disclaimer { font-size: .76rem; color: var(--muted); }

.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 640px) { .quick { grid-template-columns: repeat(2, 1fr); } }
.quick button { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; font-weight: 650; min-width: 0; }
.quick button svg { width: 24px; height: 24px; color: var(--accent); }
.quick button:hover { border-color: var(--accent); }
.quick button.lead { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.quick button.lead svg { color: var(--accent-ink); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 9px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.t th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.t td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t td.r, table.t th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scroll-x { overflow-x: auto; }

/* Modal / sheet */
.overlay { position: fixed; inset: 0; background: rgba(10,16,13,.45); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 680px; max-height: 92%; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 720px) { .overlay { align-items: center; } .sheet { border-radius: 14px; max-height: 88%; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.sheet-body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.sheet-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toast-wrap { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 9px; font-weight: 600; font-size: .9rem; box-shadow: var(--shadow); }
@media (min-width: 900px) { .toast-wrap { bottom: 24px; } }

/* House workspace */
.house { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.house-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.house-bar .sp { flex: 1; }
.house-bar select { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 8px; font-weight: 600; max-width: 180px; }
.house-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; position: relative; }
.house-body.split { grid-template-columns: 1fr 1fr; }
@media (max-width: 899px) { .house-body.split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
.pane { position: relative; min-height: 0; min-width: 0; overflow: hidden; }
.pane canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.plan-pane { background: var(--plan-bg); }
.view3d-pane { background: #DDE3E0; }
.toolbar { position: absolute; top: 10px; left: max(10px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: var(--shadow); z-index: 5; max-height: calc(100% - 20px); overflow-y: auto; scrollbar-width: none; }
.toolbar button { width: 40px; height: 40px; border: 0; background: none; border-radius: 7px; display: grid; place-items: center; cursor: pointer; color: var(--ink); flex: none; }
.toolbar button svg { width: 21px; height: 21px; }
.toolbar button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.toolbar button:hover:not([aria-pressed="true"]) { background: var(--surface-2); }
.toolbar hr { border: 0; border-top: 1px solid var(--line); margin: 2px 4px; }
.float-tr { position: absolute; top: 10px; right: max(10px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; z-index: 5; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 80px); }
.float-tr .btn { box-shadow: var(--shadow); }
.float-bl { position: absolute; bottom: 10px; left: max(10px, env(safe-area-inset-left, 0px)); z-index: 4; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; max-width: calc(100% - 20px); pointer-events: none; }
.float-bl > * { pointer-events: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: .72rem; font-weight: 600; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 18px; height: 4px; border-radius: 2px; display: inline-block; }
.hintbox { background: var(--ink); color: var(--bg); font-size: .8rem; font-weight: 600; padding: 6px 10px; border-radius: 8px; max-width: 360px; }
.props { position: absolute; z-index: 6; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; }
.props-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.props-head h3 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.props-body { padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 899px) { .props { left: 0; right: 0; bottom: 0; max-height: 58%; border-radius: 14px 14px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); } }
@media (min-width: 900px) {
  .props { position: static; border-width: 0 0 0 1px; border-radius: 0; box-shadow: none; min-height: 0; }
  .house-body.with-props { grid-template-columns: 1fr 320px; }
  .house-body.split.with-props { grid-template-columns: 1fr 1fr 320px; }
}
.warn-list { display: flex; flex-direction: column; gap: 6px; }
.joy { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: 22px; width: 116px; height: 116px; border-radius: 50%; background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.7); z-index: 5; touch-action: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.compare-handle { position: absolute; top: 0; bottom: 0; width: 4px; background: #fff; z-index: 4; cursor: ew-resize; box-shadow: 0 0 0 1px rgba(0,0,0,.2); touch-action: none; }
.compare-handle::after { content: "⟷"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; color: #222; border-radius: 99px; padding: 4px 8px; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.compare-label { position: absolute; top: 56px; z-index: 4; background: rgba(0,0,0,.6); color: #fff; font-size: .78rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.info3d { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); bottom: 14px; width: min(420px, calc(100% - 24px)); }

.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .cap { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); color: #fff; font-size: .68rem; padding: 3px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb .x { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.6); color: #fff; border: 0; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; }
.thumb.file { display: grid; place-items: center; padding: 6px; text-align: center; font-size: .75rem; }

<script>
/* ---- 00-core.js ---- */
/* Huset mitt – kjerne: hjelpefunksjoner, formatering, lagring, tilstand, navigasjon */
'use strict';
const HM = window.HM = { actions: {}, views: {} };

// ---------- Hjelpefunksjoner ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round = (v, step = 1) => Math.round(v / step) * step;
const byId = (arr, id) => (arr || []).find(x => x.id === id);
const num = v => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
HM.util = { $, $$, esc, uid, clone, clamp, round, byId, num };

// ---------- Norsk formatering ----------
const NB = 'nb-NO';
const fmtNum = (n, d = 0) => new Intl.NumberFormat(NB, { minimumFractionDigits: d, maximumFractionDigits: d }).format(n || 0);
const nok = (n, d = 0) => new Intl.NumberFormat(NB, { style: 'currency', currency: 'NOK', minimumFractionDigits: d, maximumFractionDigits: d }).format(n || 0).replace(/ /g, ' ');
const todayISO = () => { const d = new Date(); return isoOf(d); };
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseISO = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const addMonths = (iso, n) => { const d = parseISO(iso); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return isoOf(d); };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const fmtDate = (iso, opts) => iso ? parseISO(iso).toLocaleDateString(NB, opts || { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtDateShort = iso => iso ? parseISO(iso).toLocaleDateString(NB, { day: 'numeric', month: 'short' }) : '';
const fmtDay = iso => iso ? parseISO(iso).toLocaleDateString(NB, { weekday: 'short', day: 'numeric', month: 'short' }) : '';
const relDays = iso => { if (!iso) return ''; const n = daysBetween(todayISO(), iso); if (n === 0) return 'i dag'; if (n === 1) return 'i morgen'; if (n === -1) return 'i går'; return n > 0 ? `om ${n} dager` : `${-n} dager siden`; };
// lengder lagres i millimeter
const fmtLen = (mm, approx) => { if (mm == null || !isFinite(mm)) return '–'; const s = Math.abs(mm) >= 1000 ? fmtNum(mm / 1000, 2) + ' m' : fmtNum(mm / 10, mm % 10 ? 1 : 0) + ' cm'; return (approx ? '≈ ' : '') + s; };
const fmtMM = mm => fmtNum(Math.round(mm)) + ' mm';
const fmtArea = mm2 => fmtNum(mm2 / 1e6, 1) + ' m²';
/** Tolker «3,45 m», «345 cm», «3450 mm». Tall uten enhet tolkes i defUnit. Returnerer mm eller null. */
function parseLen(str, defUnit = 'mm') {
  if (str == null) return null;
  const s = String(str).trim().toLowerCase().replace(/\s/g, '').replace(',', '.');
  if (!s) return null;
  const m = s.match(/^(-?\d*\.?\d+)(mm|cm|m)?$/);
  if (!m) return null;
  const v = parseFloat(m[1]); const u = m[2] || defUnit;
  return u === 'm' ? v * 1000 : u === 'cm' ? v * 10 : v;
}
Object.assign(HM.util, { fmtNum, nok, todayISO, isoOf, parseISO, addDays, addMonths, daysBetween, fmtDate, fmtDateShort, fmtDay, relDays, fmtLen, fmtMM, fmtArea, parseLen });

const ICONS = {

  stairs: '<path d="M4 20h4v-4h4v-4h4V8h4"/>',
  sofa: '<path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M3 11h18v6H3zM5 17v2M19 17v2"/>',
  ruler: '<path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  redo: '<path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>',

  walk: '<circle cx="13" cy="4.5" r="1.8"/><path d="m9 21 2-6 3 3v3M8 12l2-4 4 1 2 3 3 1M11 15l-1-4"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',

  compare: '<rect x="3" y="4" width="18" height="16" rx="1"/><path d="M12 4v16"/>',

  alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/>',

  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>',

const icon = (name, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;

// ---------- Lagring (IndexedDB) ----------
const Store = {
  db: null, name: 'huset-mitt', available: true, mem: { kv: new Map(), blobs: new Map() },
  open(name) {
    this.name = name;
    return new Promise(resolve => {
      let req;
      try { req = indexedDB.open(name, 1); } catch (e) { this.available = false; return resolve(false); }
      req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs'); };
      req.onsuccess = () => { this.db = req.result; this.available = true; resolve(true); };
      req.onerror = () => { this.available = false; resolve(false); };
      req.onblocked = () => { this.available = false; resolve(false); };
    });
  },
  close() { try { this.db && this.db.close(); } catch (e) {} this.db = null; },
  _tx(store, mode, fn) {
    if (!this.db) { return Promise.resolve(fn(null)); }
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, mode); const os = tx.objectStore(store); let out;
      const r = fn(os); if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => resolve(out); tx.onerror = () => reject(tx.error); tx.onabort = () => reject(tx.error);
    });
  },
  get(store, key) { if (!this.db) return Promise.resolve(this.mem[store].get(key)); return this._tx(store, 'readonly', os => os.get(key)); },
  put(store, key, val) { if (!this.db) { this.mem[store].set(key, val); return Promise.resolve(); } return this._tx(store, 'readwrite', os => os.put(val, key)); },
  del(store, key) { if (!this.db) { this.mem[store].delete(key); return Promise.resolve(); } return this._tx(store, 'readwrite', os => os.delete(key)); },
  keys(store) { if (!this.db) return Promise.resolve([...this.mem[store].keys()]); return this._tx(store, 'readonly', os => os.getAllKeys()); },
  clear(store) { if (!this.db) { this.mem[store].clear(); return Promise.resolve(); } return this._tx(store, 'readwrite', os => os.clear()); },
};
HM.store = Store;

// ---------- Tilstand ----------
const SCHEMA = 1;
function emptyPlan() {
  return { floors: [{ id: uid('fl'), name: '1. etasje', elevation: 0, height: 2400 }], walls: [], openings: [], rooms: [], stairs: [], furniture: [] };
}
function emptyState() {
  const v = { id: uid('ver'), name: 'Dagens hus', kind: 'current', createdAt: new Date().toISOString(), basedOn: null, description: 'Slik huset er i dag.', plan: emptyPlan() };
  return {
    schema: SCHEMA, createdAt: new Date().toISOString(),
    house: { name: 'Huset mitt', address: '', built: '' },
    activeVersionId: v.id, versions: [v],
    projects: [], receipts: [], events: [], shopping: [], tools: [], checklists: [], docs: [], maintenance: [], media: [], imports: [],
    settings: { lowPower: 'auto', theme: 'system' },
  };
}
HM.emptyPlan = emptyPlan; HM.emptyState = emptyState;

HM.state = null;
HM.mode = 'real'; // 'real' | 'demo'
let saveTimer = null;
HM.save = function (now) {
  clearTimeout(saveTimer);
  const doSave = () => Store.put('kv', 'state', JSON.parse(JSON.stringify(HM.state))).then(() => { HM.lastSaved = Date.now(); }).catch(e => { console.error(e); HM.toast('Kunne ikke lagre. Ta en sikkerhetskopi.'); });
  if (now) return doSave();
  saveTimer = setTimeout(doSave, 250);
  return Promise.resolve();
};
/** Endre apptilstand og lagre. fn får state. */
HM.update = function (fn, opts = {}) {
  fn(HM.state);
  HM.save();
  if (opts.render !== false) HM.render();
};
HM.version = () => byId(HM.state.versions, HM.state.activeVersionId) || HM.state.versions[0];
HM.currentVersion = () => HM.state.versions.find(v => v.kind === 'current') || HM.state.versions[0];
HM.plan = () => HM.version().plan;

function migrate(s) {
  const e = emptyState();
  for (const k of Object.keys(e)) if (s[k] === undefined) s[k] = e[k];
  s.settings = Object.assign({}, e.settings, s.settings || {});
  for (const v of s.versions) { const p = v.plan; for (const k of ['floors', 'walls', 'openings', 'rooms', 'stairs', 'furniture']) if (!p[k]) p[k] = []; if (!p.floors.length) p.floors.push(emptyPlan().floors[0]); }
  s.schema = SCHEMA;
  return s;
}
HM.migrate = migrate;

HM.loadMode = async function (mode) {
  HM.mode = mode;
  try { localStorage.setItem('hm-mode', mode); } catch (e) {}
  Store.close();
  await Store.open(mode === 'demo' ? 'huset-mitt-demo' : 'huset-mitt');
  let s = null;
  try { s = await Store.get('kv', 'state'); } catch (e) { console.error(e); }
  if (!s) {
    s = mode === 'demo' ? HM.createDemoState() : emptyState();
    HM.state = s; await HM.save(true);
    if (mode === 'demo' && HM.seedDemoMedia) await HM.seedDemoMedia();
  }
  HM.state = migrate(s);
  HM.undo.reset();
};

// ---------- Blobs / medier ----------
HM.blobUrlCache = new Map();
HM.putBlob = async (blob, id = uid('blob')) => { await Store.put('blobs', id, blob); return id; };
HM.getBlob = id => Store.get('blobs', id);
HM.blobUrl = async id => {
  if (!id) return '';
  if (HM.blobUrlCache.has(id)) return HM.blobUrlCache.get(id);
  const b = await HM.getBlob(id); if (!b) return '';
  const u = URL.createObjectURL(b); HM.blobUrlCache.set(id, u); return u;
};
/** Fyller <img data-blob="id"> og lenker <a data-blob-href="id"> etter render. */
HM.hydrateBlobs = function (root = document) {
  $$('img[data-blob]', root).forEach(async img => { const u = await HM.blobUrl(img.dataset.blob); if (u) img.src = u; });
  $$('[data-blob-href]', root).forEach(async a => { const u = await HM.blobUrl(a.dataset.blobHref); if (u) a.href = u; });
};
/** Legger inn en fil som medie. Bilder skaleres ned for å spare plass. */
HM.addMedia = async function (file, meta = {}) {
  let blob = file, w = null, h = null;
  if (file.type && file.type.startsWith('image/') && file.type !== 'image/svg+xml') {
    try { const r = await HM.downscale(file, 2200, 0.86); blob = r.blob; w = r.w; h = r.h; } catch (e) { console.warn('kunne ikke skalere', e); }
  }
  const blobId = await HM.putBlob(blob);
  const m = Object.assign({ id: uid('med'), blobId, name: file.name || 'fil', type: blob.type || file.type || 'application/octet-stream', size: blob.size, w, h, createdAt: new Date().toISOString(), kind: 'foto', roomIds: [], projectId: null, tags: [] }, meta);
  HM.state.media.push(m);
  HM.save();
  return m;
};
HM.removeMedia = async function (id) {
  const m = byId(HM.state.media, id); if (!m) return;
  HM.state.media = HM.state.media.filter(x => x.id !== id);
  await Store.del('blobs', m.blobId);
  HM.save();
};

HM.saveFile = async function (filename, blob) {
  try {
    if (window.claude && window.claude.use) {
      const dl = await Promise.race([window.claude.use('downloads'), new Promise(r => setTimeout(() => r(null), 3000))]);

    }

HM.modal = function ({ title, body, foot = '', onMount, wide, onClose }) {

  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(); };
  const onKey = e => { if (e.key === 'Escape') close(); };

Regler:
- Ta bare med rom, vegger, dører og vinduer du faktisk ser eller kan lese i materialet. Ikke finn på rom som ikke vises. Rom som bare så vidt skimtes skal ha "partial": true.
- Skill tydelig mellom mål som står skrevet i materialet ("lest"), mål regnet ut fra et kjent mål eller målestokk ("skalert"), og mål du anslår ut fra synlige ting som dører, fliser eller møbler ("anslatt"). Bruk "ukjent" og null hvis du ikke har grunnlag.
- Et bilde av ett rom viser sjelden hele rommet. Si hva som mangler.
- Ikke vurder om vegger er bærende, og ikke vurder lovlighet eller teknisk tilstand.
- Alle mål i millimeter, innvendige mål (vegg til vegg). Navn og tekster på norsk bokmål.

      if (extra) Object.assign(ed, extra);
      canvas.style.cursor = t === 'select' ? 'default' : 'crosshair';
      ed.onTool && ed.onTool(t);
      draw();
    }
    function fit() { view = HM.fitView(HM.plan(), HM.activeFloorId(), W, H, 60); draw(); }
    function zoomTo(kind, id) {
      const plan = HM.plan(); let pts = [];
      if (kind === 'room') { const r = byId(plan.rooms, id); if (r) pts = r.pts; }
      if (kind === 'wall') { const w = byId(plan.walls, id); if (w) pts = [w.a, w.b]; }
      if (!pts.length) return;
      const xs = pts.map(p => p.x), ys = pts.map(p => p.y); const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
      view = { ...view, ox: W / 2 - cx * view.s, oy: H / 2 - cy * view.s }; draw();
    }
    function finishChain() { ed.chain = null; ed.preview = null; draw(); }
    function onKey(e) {
      if (e.target.closest('input, textarea, select')) return;
      if (e.key === 'Escape') { if (ed.chain) finishChain(); else if (ed.tool !== 'select') setTool('select'); else HM.select(null, null); }
      if ((e.key === 'Delete' || e.key === 'Backspace') && HM.sel) { e.preventDefault(); HM.deleteSelected(); }
      if ((e.key === 'r' || e.key === 'R') && HM.sel && (HM.sel.kind === 'furniture' || HM.sel.kind === 'stairs')) { const coll = HM.sel.kind === 'furniture' ? 'furniture' : 'stairs'; HM.commitPlan(pl => { const o = byId(pl[coll], HM.sel.id); o.rot = ((o.rot || 0) + 90) % 360; }); }
    }
    document.addEventListener('keydown', onKey);
    const onSel = () => draw(); HM.selListeners.add(onSel);
    const onPlan = () => draw(); HM.planListeners.add(onPlan);

    Object.assign(ed, {
      canvas, draw, fit, setTool, zoomTo, finishChain, get view() { return view; },
      destroy() { ed.destroyed = true; ro.disconnect(); document.removeEventListener('keydown', onKey); HM.selListeners.delete(onSel); HM.planListeners.delete(onPlan); canvas.remove(); },
    });
    return ed;
  };

  HM.deleteSelected = function () {
    const s = HM.sel; if (!s) return;
    HM.commitPlan(pl => {
      if (s.kind === 'wall') G.deleteWall(pl, s.id);
      else if (s.kind === 'opening') pl.openings = pl.openings.filter(o => o.id !== s.id);
      else if (s.kind === 'room') G.deleteRoom(pl, s.id, true);
      else if (s.kind === 'furniture') pl.furniture = pl.furniture.filter(o => o.id !== s.id);
      else if (s.kind === 'stairs') pl.stairs = pl.stairs.filter(o => o.id !== s.id);
    });
    HM.select(null, null);
  };
})();

  // ---------- Hendelser ----------
  function wire(el, plan, obj) {
    const s = HM.sel;
    const commit = fn => HM.commitPlan(pl => { const o = s ? ({ room: pl.rooms, wall: pl.walls, opening: pl.openings, stairs: pl.stairs, furniture: pl.furniture }[s.kind]).find(x => x.id === s.id) : null; return fn(pl, o); });
    const len = (id, unit = 'cm') => { const v = el.querySelector('#' + id); return v ? parseLen(v.value, unit) : null; };
    const on = (id, ev, fn) => { const x = el.querySelector('#' + id); if (x) x.addEventListener(ev, fn); };
    el.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => { const [k, id] = (b.dataset.pick || '').split(':'); if (k && id) HM.select(k, id, { zoom: true }); }));
    if (!s) {
      const fid = HM.activeFloorId();
      on('fl_name', 'change', e => HM.commitPlan(pl => { byId(pl.floors, fid).name = e.target.value.trim() || 'Etasje'; }));
      on('fl_height', 'change', () => { const v = len('fl_height'); if (v > 1000) HM.commitPlan(pl => { byId(pl.floors, fid).height = v; }); });
      on('fl_elev', 'change', () => { const v = len('fl_elev'); if (v != null) HM.commitPlan(pl => { byId(pl.floors, fid).elevation = v; }); });
      el.querySelector('[data-do="delfloor"]')?.addEventListener('click', async () => {

        HM.commitPlan(pl => { const wids = pl.walls.filter(w => w.floorId === fid).map(w => w.id); pl.openings = pl.openings.filter(o => !wids.includes(o.wallId)); for (const k of ['walls', 'rooms', 'stairs', 'furniture']) pl[k] = pl[k].filter(x => x.floorId !== fid); pl.floors = pl.floors.filter(f => f.id !== fid); });
        HM.editorFloor = null; HM.emitPlanChanged({ floors: true });
      });
      return;
    }
    const doBtn = (name, fn) => el.querySelector(`[data-do="${name}"]`)?.addEventListener('click', fn);

    if (s.kind === 'room') {
      on('r_name', 'change', e => commit((pl, r) => { r.name = e.target.value.trim() || 'Rom'; }));
      on('r_ceiling', 'change', () => { const v = len('r_ceiling'); commit((pl, r) => { r.ceiling = v && v > 1000 ? v : null; }); });
      on('r_status', 'change', e => commit((pl, r) => { r.status = e.target.value; }));

      on('r_wallcolor', 'change', e => commit((pl, r) => { r.wallColor = e.target.value; }));
      el.querySelectorAll('[data-color]').forEach(b => b.addEventListener('click', () => commit((pl, r) => { r.wallColor = b.dataset.color; })));
      doBtn('roomdims', () => {
        const tw = len('r_w'), tl = len('r_l'); if (!(tw > 300) || !(tl > 300)) { HM.toast('Skriv inn bredde og lengde, f.eks. 360 eller 3,6 m'); return; }
        commit((pl, r) => HM.setRoomInner(pl, r, tw, tl));

  function newFloor() {
    const plan = HM.plan(); const top = plan.floors.slice().sort((a, b) => b.elevation - a.elevation)[0];

      foot: `<button class="btn" data-close>Avbryt</button><button class="btn primary" id="nf_ok">Opprett</button>`,
      onMount: m => m.$('#nf_ok').onclick = () => {

          const fl = pl.floors.slice().sort((a, b) => a.elevation - b.elevation);
          const over = v.nf_pos === 'over';
          const ref = over ? fl[fl.length - 1] : fl[0];
          const slab = 250;
          const elevation = over ? ref.elevation + (ref.height || 2400) + slab : ref.elevation - h - slab;
          pl.floors.push({ id, name: v.nf_name || 'Etasje', elevation, height: h });
          if (m.$('#nf_copy').checked) {
            const walls = pl.walls.filter(w => w.floorId === ref.id && G.roomsOfWall(pl, w).length <= 1 && isExterior(pl, w));
            walls.forEach(w => pl.walls.push(Object.assign(JSON.parse(JSON.stringify(w)), { id: uid('w'), floorId: id, status: 'anslatt', confirmed: null, height: null, needsClarification: false, note: '' })));
          }
        });
        HM.editorFloor = id; m.close(); HM.render();
      },
    });
  }
  function isExterior(pl, w) {
    const d = G.wallDir(w), n = { x: -d.y, y: d.x }; const mid = { x: (w.a.x + w.b.x) / 2, y: (w.a.y + w.b.y) / 2 }; const k = (w.t || 100) / 2 + 80;
    const rooms = pl.rooms.filter(r => r.floorId === w.floorId);
    const a = rooms.some(r => G.pointInPoly({ x: mid.x + n.x * k, y: mid.y + n.y * k }, r.pts)), b = rooms.some(r => G.pointInPoly({ x: mid.x - n.x * k, y: mid.y - n.y * k }, r.pts));
    return a !== b;
  }

  function quickRoom() {

  HM.addRoomFromInner = function ({ name, w, l, ceiling, t = 100, status = 'anslatt', floorId, props = {} }) {
    let rid;
    HM.commitPlan(pl => {

  function planSheet(plan, fid, W, H, title) {
    const { canvas } = HM.renderPlanImage(plan, fid, W, H - 120, { pad: 90, grid: false });
    const c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.drawImage(canvas, 0, 70);
    ctx.fillStyle = '#18231F'; ctx.font = '700 30px "Familjen Grotesk", sans-serif'; ctx.textAlign = 'left'; ctx.fillText(title, 40, 50);

  async function exportPNG() {
    const plan = HM.plan(); const fid = HM.activeFloorId(); const f = byId(plan.floors, fid);
    const c = planSheet(plan, fid, 2400, 1700, `${HM.state.house.name} – ${f.name} (${HM.version().name})`);

  async function exportPDF() {
    try { await HM.loadLib('jspdf'); } catch (e) { HM.toast('PDF-biblioteket kunne ikke lastes. Sjekk nettforbindelsen.'); return; }

  async function addFiles(files) {
    for (const f of files) {
      const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
      if (!isPdf && !(f.type || '').startsWith('image/')) { HM.toast(`${f.name}: bare bilder og PDF støttes`); continue; }
      const it = { file: f, kind: isPdf ? 'plantegning' : 'innvendig', room: '', url: isPdf ? null : URL.createObjectURL(f), pdf: isPdf, pages: 1 };
      if (isPdf) { try { it.pageImgs = await HM.ai.pdfToImages(f, 3); it.pages = it.pageImgs.length; } catch (e) { HM.toast('Kunne ikke lese PDF-en: ' + e.message); continue; } }
      imp.items.push(it);
    }
    HM.render();
  }

  async function run() {
    imp.error = null; imp.running = true; imp.streamLen = 0; HM.render();
    try {
      // lagre materialet privat først
      const mediaIds = []; const sendItems = []; const images = [];
      for (const it of imp.items) {
        if (!it.mediaId) { const m = await HM.addMedia(it.file, { kind: it.kind, note: it.room || '' }); it.mediaId = m.id; }
        mediaIds.push(it.mediaId);
        if (it.pdf) it.pageImgs.forEach((p, k) => { images.push(p); sendItems.push({ kind: it.kind, room: it.room, name: p.name, mediaId: it.mediaId }); });
        else { images.push(it.file); sendItems.push({ kind: it.kind, room: it.room, name: it.file.name, mediaId: it.mediaId }); }
      }
      const plan = HM.plan();
      const prompt = HM.ai.housePrompt(sendItems, { known: imp.known.trim(), note: imp.note.trim(), existingRooms: plan.rooms.map(r => r.name) });
      imp.ctl = new AbortController();
      const res = await HM.ai.askJson(prompt, images, { signal: imp.ctl.signal, tier: 'complex', onText: ({ text }) => { if (!imp.streamLen) { imp.streamLen = text.length; HM.route.name === 'importer' && HM.render(); } } });
      if (!res || typeof res !== 'object' || !Array.isArray(res.rooms)) throw Object.assign(new Error('Uventet svar'), { code: 'invalid_json' });
      res._items = sendItems;
      const rec = { id: uid('imp'), createdAt: new Date().toISOString(), mediaIds, known: imp.known.trim(), note: imp.note.trim(), result: res, appliedRoomIds: [] };
      HM.state.imports.push(rec); HM.save();
      imp.importId = rec.id; imp.result = res;
    } catch (e) {
      console.error(e);
      imp.error = HM.ai.errorText(e);
    } finally {
      imp.running = false; imp.ctl = null;
      if (HM.route.name === 'importer') HM.render();
    }
  }

  /** Gjør AI-forslaget om til rom og vegger. Returnerer id-ene til nye rom. */
  function applyResult(r, picks, floorId) {
    const T = 100;
    const ids = [];
    HM.commitPlan(pl => {
      const target = byId(pl.floors, floorId) || pl.floors[0];
      const aiFloors = [...new Set(picks.map(i => r.rooms[i].floor || ''))];
      const floorMap = {};
      aiFloors.forEach((name, k) => {
        if (k === 0 || aiFloors.length === 1) { floorMap[name] = target.id; return; }
        let f = pl.floors.find(x => x.name.toLowerCase() === String(name).toLowerCase());
        if (!f) { const top = pl.floors.slice().sort((a, b) => b.elevation - a.elevation)[0]; f = { id: uid('fl'), name: name || 'Etasje', elevation: top.elevation + (top.height || 2400) + 250, height: 2400 }; pl.floors.push(f); }
        floorMap[name] = f.id;
      });
      for (const fid of new Set(Object.values(floorMap))) {
        const group = picks.map(i => ({ i, rm: r.rooms[i] })).filter(x => floorMap[x.rm.floor || ''] === fid);
        const b = HM.planBounds(pl, fid);
        const placed = group.filter(x => isFinite(x.rm.x_mm) && x.rm.x_mm !== null && isFinite(x.rm.y_mm) && x.rm.y_mm !== null);
        const loose = group.filter(x => !placed.includes(x));
        const minX = placed.length ? Math.min(...placed.map(x => x.rm.x_mm)) : 0, minY = placed.length ? Math.min(...placed.map(x => x.rm.y_mm)) : 0;
        let ox = b ? b.x1 + 1500 : 0, oy = b ? b.y0 + T / 2 : 0;
        const polys = [];
        for (const x of placed) { const w = x.rm.width_mm || 3000, l = x.rm.length_mm || 3000; polys.push({ x, pts: G.rectFromInner(ox + x.rm.x_mm - minX, oy + x.rm.y_mm - minY, w, l, T) }); }
        let lx = ox + (placed.length ? Math.max(...placed.map(x => x.rm.x_mm - minX + (x.rm.width_mm || 3000))) + 1500 : 0);
        for (const x of loose) { const w = x.rm.width_mm || 3000, l = x.rm.length_mm || 3000; polys.push({ x, pts: G.rectFromInner(lx, oy, w, l, T) }); lx += w + 1500; }
        G.snapClusters(polys.map(p => ({ pts: p.pts })));
        for (const { x, pts } of polys) {
          const rm = x.rm; const st = rm.dimension_source === 'lest' ? 'materiale' : 'anslatt';
          const props = {
            name: rm.name || 'Rom', status: st,
            ceiling: rm.ceiling_height_mm && ['lest', 'skalert', 'anslatt'].includes(rm.ceiling_source) ? Math.round(rm.ceiling_height_mm) : null,
            floorFinish: G.FLOORS[rm.floor_finish] ? rm.floor_finish : 'eik',
            wallColor: /^#[0-9a-f]{6}$/i.test(rm.wall_color_hex || '') ? rm.wall_color_hex : '#F2F0EA',
            notes: rm.partial ? 'Rommet var bare delvis synlig i materialet.' : '',
            source: { importId: imp.importId, dims: rm.dimension_source || 'ukjent', confidence: rm.confidence ?? null, evidence: rm.evidence || '', partial: !!rm.partial, unknownSize: !(rm.width_mm && rm.length_mm) },
          };
          if (props.source.unknownSize) props.notes = (props.notes + ' Størrelsen var ukjent. Mål rommet.').trim();
          const { room } = G.addRoom(pl, fid, pts, props, { t: T, status: st });
          ids.push(room.id);
          // åpninger
          const ix = Math.min(pts[0].x, pts[2].x) + T / 2, iy = Math.min(pts[0].y, pts[2].y) + T / 2; const iw = Math.abs(pts[1].x - pts[0].x) - T, il = Math.abs(pts[2].y - pts[1].y) - T;
          for (const o of (r.openings || []).filter(o => o.room === rm.name)) {
            const side = ['top', 'right', 'bottom', 'left'].includes(o.side) ? o.side : 'bottom';
            const width = Math.max(400, Math.min(o.width_mm || (o.type === 'window' ? 1200 : 900), (side === 'top' || side === 'bottom' ? iw : il) - 100));
            const along = isFinite(o.offset_mm) && o.offset_mm !== null ? o.offset_mm : (side === 'top' || side === 'bottom' ? iw : il) / 2;
            const p = side === 'top' ? { x: ix + along, y: iy - T / 2 } : side === 'bottom' ? { x: ix + along, y: iy + il + T / 2 } : side === 'left' ? { x: ix - T / 2, y: iy + along } : { x: ix + iw + T / 2, y: iy + along };
            const w = G.wallAtPoint(pl, fid, p, 10); if (!w) continue;
            const L = G.wallLen(w); const off = Math.max(width / 2 + 20, Math.min(L - width / 2 - 20, G.project(w, p).t));
            pl.openings.push({ id: uid('op'), wallId: w.id, type: ['door', 'window', 'opening'].includes(o.type) ? o.type : 'opening', offset: Math.round(off), width: Math.round(width), height: Math.round(o.height_mm || (o.type === 'window' ? 1200 : 2100)), sill: Math.round(o.type === 'window' ? (o.sill_mm || 900) : 0), hinge: 'a', swing: 1, status: o.source === 'lest' ? 'materiale' : 'anslatt', needsClarification: false, note: o.side === 'unknown' || !o.side ? 'Plassering på veggen er ukjent.' : (o.leads_to && o.leads_to !== 'ukjent' ? 'Fører til ' + o.leads_to : '') });
          }
          // knytt bilder til rommet
          (rm.from_images || []).forEach(n => { const it = (r._items || [])[n - 1]; if (it && it.mediaId) { const m = byId(HM.state.media, it.mediaId); if (m && !m.roomIds.includes(room.id)) m.roomIds.push(room.id); } });
        }
      }
    });
    return ids;
  }
  HM.applyImportResult = applyResult;
})();

(function () {

/* Oppussingsprosjekter: oppgaver med avhengigheter, økonomi, tilbud, filer. */
(function () {
  const { esc, byId, uid, nok, fmtDate, fmtDateShort, todayISO, addDays, daysBetween, num, relDays } = HM.util; const icon = HM.icon; const ui = HM.ui;
  const STATUS = [['ide', 'Idé'], ['planlagt', 'Planlagt'], ['pagar', 'Pågår'], ['ferdig', 'Ferdig'], ['utsatt', 'Utsatt']];
  const STATUS_CLS = { ide: '', planlagt: 'src', pagar: 'acc', ferdig: 'ok', utsatt: 'est' };
  const PRIO = [['hoy', 'Høy'], ['middels', 'Middels'], ['lav', 'Lav']];
  HM.PROJECT_STATUS = STATUS;
  const statusPill = s => `<span class="pill ${STATUS_CLS[s] || ''}">${(STATUS.find(x => x[0] === s) || STATUS[0])[1]}</span>`;
  HM.projectStatusPill = statusPill;

  // ---------- Økonomi (rene funksjoner, testes separat) ----------
  const econ = HM.econ = {
    sign: r => r.kind === 'retur' ? -1 : 1,
    paid(state, pid) { let s = 0; for (const r of state.receipts) for (const a of r.allocations || []) if (a.projectId === pid) s += econ.sign(r) * num(a.amount); return s; },
    planned(state, pid) { return state.shopping.filter(i => i.projectId === pid && !i.bought).reduce((s, i) => s + num(i.qty || 1) * num(i.price), 0); },
    openQuotes(p) { return (p.quotes || []).filter(q => q.accepted && !q.paid).reduce((s, q) => s + num(q.amount), 0); },
    pendingQuotes(p) { return (p.quotes || []).filter(q => !q.accepted).reduce((s, q) => s + num(q.amount), 0); },
    project(state, p) {
      const paid = econ.paid(state, p.id), planned = econ.planned(state, p.id), quotes = econ.openQuotes(p), extra = num(p.extraRemaining);
      const remaining = p.status === 'ferdig' ? 0 : planned + quotes + extra;
      const forecast = paid + remaining; const budget = num(p.budget);
      return { budget, paid, planned, quotes, extra, remaining, forecast, deviation: budget - forecast, pendingQuotes: econ.pendingQuotes(p) };
    },
    totals(state) {
      const t = { budget: 0, paid: 0, remaining: 0, forecast: 0 };
      for (const p of state.projects) { const e = econ.project(state, p); t.budget += e.budget; t.paid += e.paid; t.remaining += e.remaining; t.forecast += e.forecast; }
      t.unallocated = econ.unallocatedTotal(state);
      t.allSpent = state.receipts.reduce((s, r) => s + econ.sign(r) * num(r.total), 0);
      return t;
    },
    allocated: r => (r.allocations || []).reduce((s, a) => s + num(a.amount), 0),
    unallocated: r => Math.round((num(r.total) - econ.allocated(r)) * 100) / 100,
    unallocatedTotal(state) { return state.receipts.reduce((s, r) => s + econ.sign(r) * econ.unallocated(r), 0); },
  };

  // ---------- Avhengigheter ----------
  /** Etterfølgere som må flyttes når en oppgave slutter senere. Endrer ikke data. */
  HM.taskShifts = function (project, changedId, newStart, newEnd) {
    const tasks = project.tasks.map(t => ({ ...t }));
    const ch = tasks.find(t => t.id === changedId); if (!ch) return [];
    ch.start = newStart; ch.end = newEnd;
    const shifts = new Map(); const queue = [ch];
    while (queue.length) {
      const pred = queue.shift(); if (!pred.end) continue;
      for (const s of tasks.filter(t => (t.dependsOn || []).includes(pred.id))) {
        if (!s.start) continue;
        if (s.start <= pred.end) {
          const delta = daysBetween(s.start, pred.end) + 1;
          if (!shifts.has(s.id)) shifts.set(s.id, { id: s.id, title: s.title, oldStart: s.start, oldEnd: s.end });
          s.start = addDays(s.start, delta); if (s.end) s.end = addDays(s.end, delta);
          const rec = shifts.get(s.id); rec.newStart = s.start; rec.newEnd = s.end;
          queue.push(s);
        }
      }
    }
    return [...shifts.values()];
  };
  HM.taskConflicts = function (project, t) {
    return (t.dependsOn || []).map(id => byId(project.tasks, id)).filter(p => p && p.end && t.start && t.start <= p.end && !p.done);
  };
  HM.taskLate = t => !t.done && t.end && t.end < todayISO();

  };
  function econBar(e) {
    const max = Math.max(e.budget, e.forecast, 1);

      </div>
      <div class="card"><h2>Økonomi</h2>${econStats(e)}${econBar(e)}</div>
      <div class="card"><div class="card-head"><h2>Neste oppgaver</h2><button class="btn sm" data-act="newTask" data-project="${p.id}">${icon('plus')} Ny oppgave</button></div>
        ${next.length ? `<div class="list">${next.map(t => taskRow(p, t)).join('')}</div>` : ui.empty('Ingen åpne oppgaver', 'Legg til oppgaver med datoer og avhengigheter.')}</div>

  function econStats(e) {

      <div class="stat ${e.budget && e.forecast > e.budget ? 'warn' : ''}"><div class="v">${nok(e.forecast)}</div><div class="k">Forventet sluttsum</div></div>
    </div>`;

  HM.econStats = econStats;

  function taskRow(p, t) {
    const conflicts = HM.taskConflicts(p, t); const late = HM.taskLate(t);

  HM.taskRow = taskRow;
  function tabTasks(p) {
    const sorted = p.tasks.slice().sort((a, b) => (a.done - b.done) || ((a.start || a.end || '9999') < (b.start || b.end || '9999') ? -1 : 1));
    return `<div class="card"><div class="card-head"><h2>Oppgaver</h2><button class="btn sm primary" data-act="newTask" data-project="${p.id}">${icon('plus')} Ny oppgave</button></div>
      ${sorted.length ? `<div class="list">${sorted.map(t => taskRow(p, t)).join('')}</div>` : ui.empty('Ingen oppgaver', 'Del prosjektet opp i oppgaver. En oppgave kan avhenge av en annen, for eksempel at maling må være ferdig før gulvlister monteres.')}
      ${sorted.length ? timeline(p) : ''}</div>`;
  }
  function timeline(p) {
    const ts = p.tasks.filter(t => t.start && t.end); if (!ts.length) return '';
    const min = ts.reduce((a, t) => t.start < a ? t.start : a, ts[0].start), max = ts.reduce((a, t) => t.end > a ? t.end : a, ts[0].end);
    const span = Math.max(1, daysBetween(min, max) + 1); const today = todayISO(); const tpos = daysBetween(min, today) / span * 100;
    return `<details open><summary>Tidslinje</summary><div style="display:flex;flex-direction:column;gap:5px;margin-top:8px;position:relative">
      ${tpos >= 0 && tpos <= 100 ? `<div style="position:absolute;top:0;bottom:0;left:calc(38% + ${tpos * 0.62}%);border-left:2px dashed var(--bad);opacity:.6" title="I dag"></div>` : ''}
      ${ts.sort((a, b) => a.start < b.start ? -1 : 1).map(t => { const l = daysBetween(min, t.start) / span * 100, w = Math.max(1.5, (daysBetween(t.start, t.end) + 1) / span * 100); return `<div style="display:grid;grid-template-columns:38% 1fr;gap:6px;align-items:center"><span class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.title)}</span><div style="position:relative;height:14px;background:var(--surface-2);border-radius:4px"><i style="position:absolute;left:${l}%;width:${w}%;top:0;bottom:0;border-radius:4px;background:${t.done ? 'var(--ok)' : HM.taskLate(t) ? 'var(--bad)' : 'var(--accent)'};opacity:${t.done ? .5 : .85}"></i></div></div>`; }).join('')}
      <div class="tiny muted" style="display:flex;justify-content:space-between;margin-left:38%"><span>${fmtDateShort(min)}</span><span>${fmtDateShort(max)}</span></div></div></details>`;
  }
  function tabEcon(p, e) {
    const st = HM.state;
    const recs = st.receipts.filter(r => (r.allocations || []).some(a => a.projectId === p.id)).sort((a, b) => (b.date || '') < (a.date || '') ? -1 : 1);
    return `<div class="grid-2">
      <div class="card"><h2>Oversikt</h2>${econStats(e)}${econBar(e)}
        <div class="kv small"><dt>Planlagte innkjøp (handleliste)</dt><dd>${nok(e.planned)}</dd><dt>Aksepterte tilbud, ikke betalt</dt><dd>${nok(e.quotes)}</dd>
          <dt>Andre forventede kostnader</dt><dd><input class="input" id="pe_extra" value="${p.extraRemaining || ''}" inputmode="decimal" placeholder="0" style="max-width:130px;min-height:30px;padding:4px 8px"></dd>
          ${e.pendingQuotes ? `<dt>Tilbud til vurdering (ikke regnet med)</dt><dd>${nok(e.pendingQuotes)}</dd>` : ''}</div>
        <p class="tiny muted">Betalt er summen av kvitteringer fordelt til prosjektet (returer trekkes fra). Tilbud og planlagte innkjøp regnes aldri som betalt.</p>
        ${p.status === 'ferdig' ? '<p class="tiny muted">Prosjektet er ferdig, så forventet gjenstående er satt til 0.</p>' : ''}</div>
      <div class="card"><div class="card-head"><h2>Tilbud</h2><button class="btn sm" data-act="newQuote" data-p="${p.id}">${icon('plus')} Nytt tilbud</button></div>
        ${(p.quotes || []).length ? `<div class="list">${p.quotes.map(q => `<div class="row click" data-act="editQuote" data-p="${p.id}" data-q="${q.id}"><div class="grow"><div class="title">${esc(q.supplier || 'Tilbud')}</div><div class="small muted">${q.date ? fmtDate(q.date) : ''}${q.note ? ' · ' + esc(q.note) : ''}</div></div><span class="num">${nok(q.amount)}</span>${q.paid ? '<span class="pill ok">Betalt</span>' : q.accepted ? '<span class="pill acc">Akseptert</span>' : '<span class="pill">Til vurdering</span>'}</div>`).join('')}</div>` : ui.empty('Ingen tilbud', 'Legg inn tilbud fra håndverkere. Aksepterte tilbud regnes som forventet kostnad.')}</div>
      <div class="card" style="grid-column:1/-1"><div class="card-head"><h2>Kvitteringer</h2><button class="btn sm primary" data-act="scanReceipt" data-project="${p.id}">${icon('camera')} Skann kvittering</button></div>
        ${recs.length ? `<div class="list">${recs.map(r => HM.receiptRow(r, p.id)).join('')}</div>` : ui.empty('Ingen kvitteringer', 'Ta bilde av en kvittering, så foreslår Claude butikk, dato, beløp og prosjekt.')}</div>
    </div>`;

  function tabShop(p) {
    return `<div class="grid-2"><div class="card"><div class="card-head"><h2>Handleliste</h2><button class="btn sm" data-act="newShop" data-project="${p.id}">${icon('plus')} Vare</button></div>${HM.shoppingListHtml(HM.state.shopping.filter(i => i.projectId === p.id), { project: p.id })}</div>
      <div class="card"><div class="card-head"><h2>Verktøy</h2><button class="btn sm" data-act="newTool" data-project="${p.id}">${icon('plus')} Verktøy</button></div>${HM.toolListHtml(HM.state.tools.filter(i => i.projectId === p.id))}</div>

      ${before.length && after.length ? `<div><div class="label">Før og etter</div><div class="grid-2" style="margin-top:6px"><div class="thumb" style="aspect-ratio:4/3"><img data-blob="${before[0].blobId}" alt="Før"><span class="cap">Før</span></div><div class="thumb" style="aspect-ratio:4/3"><img data-blob="${after[after.length - 1].blobId}" alt="Etter"><span class="cap">Etter</span></div></div></div>` : ''}
      ${media.length ? `<div class="thumbs">${media.map(m => mediaThumb(m)).join('')}</div>` : ui.empty('Ingen filer', 'Last opp bilder, tilbud, bruksanvisninger eller andre dokumenter.')}</div>`;

  function mediaThumb(m) {

    return `<div class="thumb ${isImg ? '' : 'file'}">${isImg ? `<a href="#" data-blob-href="${m.blobId}" target="_blank" rel="noopener"><img data-blob="${m.blobId}" alt="${esc(m.name)}"></a>` : `<a href="#" data-blob-href="${m.blobId}" target="_blank" rel="noopener" download="${esc(m.name)}">${icon('book')}<br>${esc(m.name)}</a>`}<span class="cap">${esc((m.tags || []).join(', ') || m.kind || '')}</span><button class="x" data-rmmedia="${m.id}" aria-label="Slett">×</button></div>`;
  }
  HM.mediaThumb = mediaThumb;

  function wireProject(main, p, tab) {
    main.querySelectorAll('.t-done').forEach(c => c.addEventListener('change', () => { const t = byId(p.tasks, c.dataset.t); t.done = c.checked; t.doneAt = c.checked ? todayISO() : null; HM.save(); HM.render(); }));
    const ex = main.querySelector('#pe_extra'); if (ex) ex.addEventListener('change', () => { p.extraRemaining = num(ex.value); HM.save(); HM.render(); });
    const pf = main.querySelector('#pf_file'); if (pf) pf.onchange = async () => { const tag = main.querySelector('#pf_tag').value; for (const f of pf.files) await HM.addMedia(f, { kind: (f.type || '').startsWith('image/') ? 'foto' : 'dokument', projectId: p.id, roomIds: (p.roomIds || []).slice(), tags: tag ? [tag] : [] }); HM.toast('Lagret'); HM.render(); };
    main.querySelectorAll('[data-rmmedia]').forEach(b => b.onclick = async e => { e.preventDefault(); if (await HM.confirm('Slette filen?', 'Filen slettes fra appen.', 'Slett')) { await HM.removeMedia(b.dataset.rmmedia); HM.render(); } });
    HM.wireLists && HM.wireLists(main);
    HM.wireChecklists && HM.wireChecklists(main);
  }
  HM.actions.projNewVersion = el => {
    const p = byId(HM.state.projects, el.dataset.id); const from = HM.currentVersion();
    const v = { id: uid('ver'), name: p.name, kind: 'proposal', createdAt: new Date().toISOString(), basedOn: from.id, description: 'Forslag for prosjektet ' + p.name, plan: HM.util.clone(from.plan) };
    HM.state.versions.push(v); p.versionId = v.id; HM.state.activeVersionId = v.id; HM.save();
    HM.toast('Forslaget er laget. Endringer her påvirker ikke dagens hus.'); HM.go('huset', { mode: HM.houseMode });
  };

  // ---------- Oppgaver ----------
  function taskForm(p, t) {
    const others = p.tasks.filter(x => x.id !== t.id);
    return `<div class="form-grid">
      ${ui.field('Oppgave', ui.input('t_title', t.title, 'placeholder="F.eks. Male vegger"'), 'wide')}
      ${ui.field('Start', `<input type="date" id="t_start" name="t_start" value="${t.start || ''}">`)}
      ${ui.field('Frist / slutt', `<input type="date" id="t_end" name="t_end" value="${t.end || ''}">`)}
      ${ui.field('Ansvarlig', ui.input('t_assignee', t.assignee || '', 'placeholder="Valgfritt"'))}
      ${ui.field('Påminnelse', ui.select('t_remind', [['', 'Ingen'], ['0', 'Samme dag'], ['1', '1 dag før'], ['3', '3 dager før'], ['7', '1 uke før']], t.remindDays ?? ''))}
    </div>
    ${others.length ? `<div class="field"><span>Må vente på (avhengigheter)</span><div class="btn-row">${others.map(o => `<label class="check pill" style="padding:6px 10px;font-size:.85rem"><input type="checkbox" name="t_dep_${o.id}" ${(t.dependsOn || []).includes(o.id) ? 'checked' : ''}> ${esc(o.title)}</label>`).join('')}</div></div>` : ''}
    <div class="field"><span>Sjekkliste</span><div id="t_cl" class="list">${(t.checklist || []).map((c, i) => `<div class="row" style="padding:4px 0"><input type="checkbox" data-cli="${i}" ${c.done ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--accent)"><input class="input" data-clt="${i}" value="${esc(c.text)}" style="min-height:32px;padding:4px 8px"><button class="btn icon ghost sm" data-clx="${i}" aria-label="Fjern">${icon('x')}</button></div>`).join('')}</div>
      <div class="btn-row"><input class="input" id="t_clnew" placeholder="Nytt punkt" style="flex:1"><button class="btn sm" id="t_cladd">${icon('plus')}</button></div></div>
    <label class="check"><input type="checkbox" name="t_flag" ${t.needsClarification ? 'checked' : ''}> Må avklares</label>
    ${ui.field('Notat', `<textarea name="t_note">${esc(t.note || '')}</textarea>`)}`;
  }
  function openTask(p, t, isNew) {
    const work = JSON.parse(JSON.stringify(t)); work.checklist = work.checklist || [];
    const m = HM.modal({
      title: isNew ? 'Ny oppgave' : 'Oppgave', body: taskForm(p, work),
      foot: `${isNew ? '' : `<button class="btn danger" id="t_del">${icon('trash')} Slett</button>`}<button class="btn" data-close>Avbryt</button><button class="btn primary" id="t_ok">Lagre</button>`,
      onMount: m => {
        const syncCl = () => { m.$$('[data-clt]').forEach(i => work.checklist[+i.dataset.clt].text = i.value); m.$$('[data-cli]').forEach(i => work.checklist[+i.dataset.cli].done = i.checked); };
        const rerenderCl = () => { syncCl(); const vals = HM.formValues(m.el); m.$('.sheet-body').innerHTML = taskForm(p, Object.assign(work, readTask(vals, work))); bindCl(); };
        const bindCl = () => {
          m.$('#t_cladd').onclick = () => { const v = m.$('#t_clnew').value.trim(); if (!v) return; syncCl(); work.checklist.push({ id: uid('cl'), text: v, done: false }); rerenderCl(); m.$('#t_clnew').focus(); };
          m.$('#t_clnew').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); m.$('#t_cladd').click(); } };
          m.$$('[data-clx]').forEach(b => b.onclick = () => { syncCl(); work.checklist.splice(+b.dataset.clx, 1); rerenderCl(); });
        };
        bindCl();
        m.$('#t_ok').onclick = () => {
          syncCl(); const vals = HM.formValues(m.el); const upd = readTask(vals, work);
          if (!upd.title) { HM.toast('Skriv inn en oppgave'); return; }
          if (upd.start && upd.end && upd.end < upd.start) { HM.toast('Slutt kan ikke være før start'); return; }
          // sirkulære avhengigheter
          if (circular(p, work.id, upd.dependsOn)) { HM.toast('Avhengighetene går i ring. Fjern en av dem.'); return; }
          const shifts = isNew ? [] : HM.taskShifts(p, work.id, upd.start, upd.end);
          const save = (applyShifts) => {
            const target = isNew ? work : byId(p.tasks, work.id);
            Object.assign(target, upd, { checklist: work.checklist });
            if (isNew) p.tasks.push(target);
            if (applyShifts) for (const s of shifts) { const x = byId(p.tasks, s.id); x.start = s.newStart; x.end = s.newEnd; }
            HM.save(); m.close(); HM.render();
          };
          if (shifts.length) {
            m.$('.sheet-foot').innerHTML = `<div class="notice warn" style="width:100%">${icon('alert')}<div><strong>Endringen påvirker ${shifts.length} oppgave${shifts.length > 1 ? 'r' : ''}:</strong><ul style="margin:4px 0 0;padding-left:18px">${shifts.map(s => `<li>${esc(s.title)}: ${fmtDateShort(s.oldStart)} → ${fmtDateShort(s.newStart)}</li>`).join('')}</ul></div></div>
              <button class="btn" id="t_keep">Behold de andre datoene</button><button class="btn primary" id="t_shift">Flytt berørte oppgaver</button>`;
            m.$('#t_keep').onclick = () => save(false); m.$('#t_shift').onclick = () => save(true);
            return;
          }
          save(false);
        };
        m.$('#t_del') && (m.$('#t_del').onclick = async () => { if (!(await HM.confirm('Slette oppgaven?', esc(work.title), 'Slett'))) return; p.tasks = p.tasks.filter(x => x.id !== work.id); p.tasks.forEach(x => x.dependsOn = (x.dependsOn || []).filter(d => d !== work.id)); HM.save(); HM.render(); });
      },
    });
  }
  function readTask(v, t) {
    return { title: (v.t_title || '').trim(), start: v.t_start || null, end: v.t_end || v.t_start || null, assignee: v.t_assignee || '', remindDays: v.t_remind === '' ? null : Number(v.t_remind), dependsOn: Object.keys(v).filter(k => k.startsWith('t_dep_') && v[k]).map(k => k.slice(6)), needsClarification: !!v.t_flag, note: v.t_note || '' };
  }
  function circular(p, id, deps) {
    const seen = new Set(); const stack = [...deps];
    while (stack.length) { const d = stack.pop(); if (d === id) return true; if (seen.has(d)) continue; seen.add(d); const t = byId(p.tasks, d); if (t) stack.push(...(t.dependsOn || [])); }
    return false;
  }
  HM.newTaskObj = (o = {}) => Object.assign({ id: uid('tsk'), title: '', start: null, end: null, done: false, doneAt: null, dependsOn: [], assignee: '', checklist: [], needsClarification: false, note: '', remindDays: null }, o);
  HM.actions.newTask = el => {
    const pid = el && el.dataset.project;
    if (!pid) {
      const ps = HM.state.projects.filter(p => p.status !== 'ferdig');
      if (!ps.length) { HM.modal({ title: 'Ny oppgave', body: `<p>Oppgaver hører til et prosjekt. Lag et prosjekt først, eller legg inn en avtale eller frist direkte i kalenderen.</p>`, foot: `<button class="btn" data-act="newEvent">${icon('cal')} Ny kalenderhendelse</button><button class="btn primary" data-act="newProject">${icon('plus')} Nytt prosjekt</button>`, onMount: m => m.$$('[data-act]').forEach(b => b.addEventListener('click', () => m.close())) }); return; }
      HM.modal({
        title: 'Ny oppgave – velg prosjekt', body: `<div class="list">${ps.map(p => `<div class="row click" data-pp="${p.id}"><div class="grow"><div class="title">${esc(p.name)}</div></div>${statusPill(p.status)}</div>`).join('')}</div>`,
        onMount: m => m.$$('[data-pp]').forEach(r => r.onclick = () => { m.close(); openTask(byId(HM.state.projects, r.dataset.pp), HM.newTaskObj({ start: todayISO(), end: todayISO() }), true); }),
      });
      return;
    }
    openTask(byId(HM.state.projects, pid), HM.newTaskObj(), true);
  };
  HM.actions.editTask = el => { const p = byId(HM.state.projects, el.dataset.p); const t = p && byId(p.tasks, el.dataset.t); if (t) openTask(p, t, false); };

  // ---------- Tilbud ----------
  function quoteModal(p, q, isNew) {
    HM.modal({
      title: isNew ? 'Nytt tilbud' : 'Tilbud',
      body: `<div class="form-grid">${ui.field('Leverandør / håndverker', ui.input('q_sup', q.supplier || ''), 'wide')}${ui.field('Beløp inkl. mva (kr)', ui.input('q_amt', q.amount || '', 'inputmode="decimal"'))}${ui.field('Dato', `<input type="date" name="q_date" value="${q.date || todayISO()}">`)}${ui.field('Notat', ui.input('q_note', q.note || ''), 'wide')}</div>
        <label class="check"><input type="checkbox" name="q_acc" ${q.accepted ? 'checked' : ''}> Akseptert (regnes som forventet kostnad)</label>
        <label class="check"><input type="checkbox" name="q_paid" ${q.paid ? 'checked' : ''}> Betalt (registrer selve betalingen som kvittering/faktura)</label>
        <label class="field"><span>Vedlegg (valgfritt)</span><input type="file" id="q_file"></label>`,
      foot: `${isNew ? '' : `<button class="btn danger" id="q_del">${icon('trash')}</button>`}<button class="btn" data-close>Avbryt</button><button class="btn primary" id="q_ok">Lagre</button>`,
      onMount: m => {

(function () {

    }

    return items.sort((a, b) => (a.date + (a.time || '99')) < (b.date + (b.time || '99')) ? -1 : 1);
  };
  /** Påminnelser som er aktive nå. */
  HM.dueReminders = function () {

      if (!ev.remind) continue;
      for (const d of occurrences(ev, addDays(today, -1), addDays(today, 8))) {

        if (now >= from && now <= new Date(at.getTime() + 12 * 3600000)) out.push({ title: ev.title, date: d, time: ev.time, kind: 'event', id: ev.id });

/* Innstillinger, sikkerhetskopi og gjenoppretting, demomodus, «Mer»-meny. */
(function () {
  const { esc, byId, fmtNum } = HM.util; const icon = HM.icon; const ui = HM.ui;

  function b64(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(blob); }); }
  function fromB64(s, type) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type }); }

  HM.makeBackup = async function () {
    const blobs = {};
    for (const key of await HM.store.keys('blobs')) { const b = await HM.getBlob(key); if (b) blobs[key] = { type: b.type || 'application/octet-stream', data: await b64(b) }; }
    return { app: 'huset-mitt', format: 1, exportedAt: new Date().toISOString(), mode: HM.mode, state: HM.state, blobs };
  };
  HM.validateBackup = function (data) {
    if (!data || data.app !== 'huset-mitt' || !data.state || !Array.isArray(data.state.versions) || !data.state.versions.length) throw new Error('Filen er ikke en sikkerhetskopi fra Huset mitt.');
    return true;
  };
  HM.restoreBackup = async function (data) {
    HM.validateBackup(data);
    await HM.store.clear('blobs');
    for (const [k, v] of Object.entries(data.blobs || {})) await HM.store.put('blobs', k, fromB64(v.data, v.type));
    HM.blobUrlCache.forEach(u => URL.revokeObjectURL(u)); HM.blobUrlCache.clear();
    HM.state = HM.migrate(JSON.parse(JSON.stringify(data.state)));
    await HM.save(true);
    HM.undo.reset(); HM.sel = null; HM.editorFloor = null;
  };
  HM.backupSummary = d => { const s = d.state; return `${s.versions.reduce((a, v) => a + v.plan.rooms.length, 0)} rom i ${s.versions.length} versjon${s.versions.length > 1 ? 'er' : ''}, ${s.projects.length} prosjekter, ${s.receipts.length} kvitteringer, ${s.docs.length} dokumenter, ${Object.keys(d.blobs || {}).length} bilder og filer`; };

  HM.views.innstillinger = function (main) {
    const st = HM.state; const lp = st.settings.lowPower;
    main.innerHTML = `<div class="page">
      <div class="page-head"><div><h1>Innstillinger</h1></div></div>
      <div class="grid-2">
        <div class="card"><h2>Huset</h2><div class="form-grid">${ui.field('Navn', ui.input('s_hname', st.house.name), 'wide')}${ui.field('Adresse', ui.input('s_addr', st.house.address || ''), 'wide')}${ui.field('Byggeår', ui.input('s_built', st.house.built || '', 'inputmode="numeric"'))}</div><div><button class="btn sm primary" id="s_hsave">Lagre</button></div></div>
        <div class="card"><h2>Sikkerhetskopi</h2>
          <p class="small muted">Dataene dine lagres privat i denne nettleseren på denne enheten. Ta jevnlig sikkerhetskopi. Kopien inneholder husmodellen, alle versjoner, prosjekter, kvitteringer, dokumenter og alle bilder.</p>
          <div class="btn-row"><button class="btn primary" id="s_backup">${icon('download')} Last ned sikkerhetskopi</button><label class="btn">${icon('upload')} Gjenopprett fra fil<input type="file" id="s_restore" accept=".json,application/json" hidden></label></div>
          <div id="s_bstatus"></div>
          <div class="small muted" id="s_usage"></div>
        </div>
        <div class="card"><h2>Bildetolking med Claude</h2>${HM.ai.statusHtml()}
          <details><summary>Hva koster det, og trenger jeg en API-nøkkel?</summary><div class="small" style="display:flex;flex-direction:column;gap:6px;margin-top:6px">
            <p><strong>Når du åpner appen på claude.ai</strong> brukes din egen Claude-konto. Du trenger ingen API-nøkkel, og det kommer ingen egen regning. Hver tolking bruker litt av kvoten i abonnementet ditt. Du blir spurt om tillatelse første gang.</p>
            <p><strong>Hvis du åpner appen som egen fil</strong> (utenfor claude.ai) kan du legge inn en API-nøkkel fra console.anthropic.com. Da betaler du per bruk. Med modellen Claude Opus 5.5 ($4 per million tokens inn, $20 ut) koster én tolking av 3–4 bilder typisk rundt 0,05–0,15 dollar (omtrent 0,50–1,50 kr). En kvittering koster noen øre.</p>

      <button class="btn sm primary" data-act="go" data-to="importer" title="Last opp bilde">${icon('upload')}<span class="hide-xs">Last opp bilde</span></button>`;
    const nav = app.querySelector('.nav');
    nav.innerHTML = NAV.map(n => n[0] === 'sep' ? '<span class="nav-sep"></span>' : `<button data-act="go" data-to="${n[0]}" class="${n[3] === 'extra' ? 'nav-extra' : n[3] === 'more' ? 'nav-more' : ''}" ${(r === n[0] || (n[0] === 'mer' && MORE.includes(r) && window.innerWidth < 900)) ? 'aria-current="page"' : ''}>${icon(n[1])}<span>${n[2]}</span></button>`).join('');
    document.body.classList.toggle('in-house', HM.route.name === 'huset');
  };

  async function boot() {
    const st = document.createElement('style'); st.textContent = '@media (max-width:520px){.hide-xs{display:none}} body.in-house main{overflow:hidden}'; document.head.appendChild(st);
    let mode = 'real'; try { mode = localStorage.getItem('hm-mode') === 'demo' ? 'demo' : 'real'; } catch (e) {}
    await HM.loadMode(mode);
    if (!HM.store.available) setTimeout(() => HM.toast('Lagring er ikke tilgjengelig i denne visningen. Endringer forsvinner når du lukker siden.', 6000), 500);
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
    if (window.pdfjsLib && window.pdfjsWorker) { /* pdf.js bruker innebygd arbeider */ }
    const hash = (location.hash || '').replace('#', '');
    HM.route = { name: HM.views[hash] && !['prosjekt', 'rom'].includes(hash) ? hash : 'oversikt', params: {} };
    HM.render();
    HM.ai.init();
    const rem = HM.dueReminders(); if (rem.length) setTimeout(() => HM.toast(`${rem.length} påminnelse${rem.length > 1 ? 'r' : ''}: ${rem[0].title}${rem.length > 1 ? ' …' : ''}`, 5000), 800);
    window.addEventListener('resize', () => { if (HM.route.name !== 'huset') HM.renderShell(); });
  }
  HM.boot = boot;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
